trigger:
  batch: true
  branches:
    include:
      - main
      - release

variables:
  BUNDLE_TARGET: dev

stages:

- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Package Notebooks'
    pool:
      name: Default
    steps:

    - checkout: self
      clean: true
      displayName: 'Checkout Repository'

    - script: |
        python3 -m pip install --upgrade pip
        pip3 install databricks-sdk
      displayName: 'Install Dependencies'

    - script: |
        cp -R $(Build.SourcesDirectory)/* $(Build.BinariesDirectory)/
      displayName: 'Copy Project Files'

    - task: ArchiveFiles@2
      displayName: 'Create Artifact ZIP'
      inputs:
        rootFolderOrFile: '$(Build.BinariesDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact'
      inputs:
        ArtifactName: 'DatabricksBuild'


- stage: Deploy
  displayName: 'Deploy Stage'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    displayName: 'Deploy to Databricks'
    pool:
      name: Default
    steps:

    - checkout: self
      clean: true
      displayName: 'Checkout Repository'

    - script: |
        mkdir -p $HOME/.databricks
        curl -fsSL https://github.com/databricks/cli/releases/download/v0.297.1/databricks_cli_0.297.1_darwin_amd64.zip -o /tmp/databricks.zip
        unzip -o /tmp/databricks.zip -d $HOME/.databricks
        chmod +x $HOME/.databricks/databricks
        $HOME/.databricks/databricks --version
      displayName: 'Install Databricks CLI'

    - script: |
        $HOME/.databricks/databricks bundle validate -t $(BUNDLE_TARGET)
      displayName: 'Validate Bundle'
      env:
        DATABRICKS_HOST: $(DATABRICKS_HOST)
        DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

    - script: |
        $HOME/.databricks/databricks bundle deploy -t $(BUNDLE_TARGET)
      displayName: 'Deploy Bundle to Databricks'
      env:
        DATABRICKS_HOST: $(DATABRICKS_HOST)
        DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)


- stage: Test
  displayName: 'Test Stage'
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: TestJob
    displayName: 'Run Integration Tests'
    pool:
      name: Default
    steps:

    - script: |
        mkdir -p $HOME/.databricks
        curl -fsSL https://github.com/databricks/cli/releases/download/v0.297.1/databricks_cli_0.297.1_darwin_amd64.zip -o /tmp/databricks.zip
        unzip -o /tmp/databricks.zip -d $HOME/.databricks
        chmod +x $HOME/.databricks/databricks
        $HOME/.databricks/databricks --version
      displayName: 'Install Databricks CLI'

    - script: |
        $HOME/.databricks/databricks bundle run batch-integration-test -t $(BUNDLE_TARGET)
      displayName: 'Run Batch Integration Test'
      env:
        DATABRICKS_HOST: $(DATABRICKS_HOST)
        DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
      timeoutInMinutes: 60


- stage: RunPipeline
  displayName: 'Run Pipeline Stage'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: RunJob
    displayName: 'Run Health Analytics Pipeline'
    pool:
      name: Default
    steps:

    - script: |
        mkdir -p $HOME/.databricks
        curl -fsSL https://github.com/databricks/cli/releases/download/v0.297.1/databricks_cli_0.297.1_darwin_amd64.zip -o /tmp/databricks.zip
        unzip -o /tmp/databricks.zip -d $HOME/.databricks
        chmod +x $HOME/.databricks/databricks
        $HOME/.databricks/databricks --version
      displayName: 'Install Databricks CLI'

    - script: |
        $HOME/.databricks/databricks bundle run health-analytics-pipeline -t $(BUNDLE_TARGET)
      displayName: 'Run Health Analytics Pipeline'
      env:
        DATABRICKS_HOST: $(DATABRICKS_HOST)
        DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
      timeoutInMinutes: 60
